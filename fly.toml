# Fly.io config for one always-on machine (no cold start when friends click the link).
# Rooms are in-memory: run exactly ONE machine. Deploy with: fly deploy --ha=false
app = "troll-golf-khiem"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
